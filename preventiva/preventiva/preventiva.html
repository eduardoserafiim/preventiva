<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventiva</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>

            <nav class="sidebar">
                <div class="sidebar-header">
                    <h2>Suporte T.I</h2>
                </div>
            
                <ul class="sidebar-menu">
                    <li>
                        <a href="#" class="menu-item active">
                            <span>Cadastrar Computador</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="menu-item">
                            <span>Cadastrar Impressora</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="menu-item">
                            <span>Computadores</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="menu-item">
                            <span>Impressoras</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </header>
        <main class="main-content">
            <div id="cadastrar-computadores" class="page active">
                <div class="page-header">
                    <h1>Cadastrar Computador</h1>
                    <p>Cadastre os computadores do HAP</p>
                </div>
                <div class="form-container">
                    <form id="computador-form" class="equipamento-form">
                        <div class="form-grid">
                        <div class="form-group">
                            <label for="comp-nome">Nome</label>
                            <input type="text" id="comp-nome" name="nome" required>
                        </div>
                        <div class="form-group">
                                <label for="comp-modelo">Modelo</label>
                                <input type="text" id="comp-modelo" name="modelo" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="comp-processador">Processador</label>
                                <input type="text" id="comp-processador" name="processador" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="comp-memoria">Memória RAM</label>
                                <select id="comp-memoria" name="memoria" required>
                                    <option value="">Selecione...</option>
                                    <option value="4GB">4GB</option>
                                    <option value="8GB">8GB</option>
                                    <option value="16GB">16GB</option>
                                    <option value="32GB">32GB</option>
                                    <option value="64GB">64GB</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="comp-armazenamento">Disco</label>
                                <input type="text" id="comp-armazenamento" name="armazenamento" placeholder="Ex: SSD 256GB" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="comp-so">Sistema Operacional</label>
                                <select id="comp-so" name="so" required>
                                    <option value="">Selecione...</option>
                                    <option value="Windows 10">Windows 10</option>
                                    <option value="Windows 11">Windows 11</option>
                                    <option value="Ubuntu">Ubuntu</option>
                                    <option value="macOS">macOS</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="comp-office">Office</label>
                                <select id="comp-office" name="office" required>
                                    <option value="">Selecione...</option>
                                    <option value="Libre Office">Libre Office</option>
                                    <option value="Office">Office</option>
                                    <option value="WPS">WPS</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="comp-serie">Número de Série</label>
                                <input type="text" id="comp-serie" name="serie" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="comp-localizacao">Localização</label>
                                <input type="text" id="comp-localizacao" name="localizacao" placeholder="Ex: Sala 101" required>
                            </div>

                            <div class="form-group">
                                <label for="comp-legendaA">Legenda A</label>
                                <input type="radio" class="radio" name="legendaA"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda B</label>
                                <input type="radio" class="radio" name="legendaB"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda C</label>
                                <input type="radio" class="radio" name="legendaC"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda D</label>
                                <input type="radio" class="radio" name="legendaD"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda E</label>
                                <input type="radio" class="radio" name="legendaE"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda F</label>
                                <input type="radio" class="radio" name="legendaF"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda G</label>
                                <input type="radio" class="radio" name="legendaG"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda H</label>
                                <input type="radio" class="radio" name="legendaH"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda I</label>
                                <input type="radio" class="radio" name="legendaI"  required>
                            </div>
                            <div class="form-group">
                                <label for="comp-legendaA">Legenda J</label>
                                <input type="radio" class="radio" name="legendaJ"  required>
                            </div>
                            
                            <div class="form-group">
                                <label for="comp-status">Status</label>
                                <select id="comp-status" name="status" required>
                                    <option value="">Selecione...</option>
                                    <option value="Ativo">Ativo</option>
                                    <option value="Inativo">Inativo</option>
                                    <option value="Manutenção">Manutenção</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Salvar Computador
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="clearForm('computerForm')">
                                <i class="fas fa-eraser"></i> Limpar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
